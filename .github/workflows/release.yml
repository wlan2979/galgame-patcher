name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify the installed wheel matches the release tag
        run: |
          python -m pip install --no-deps dist/*.whl
          test "$(galpatch --version)" = "galgame-patcher ${GITHUB_REF_NAME#v}"
          python -c 'from importlib.metadata import metadata; assert metadata("galgame-patcher")["License-Expression"] == "PolyForm-Noncommercial-1.0.0"'
          { cat LICENSE; printf '\n'; cat NOTICE; } > dist/LICENSE.txt

      - name: Upload Python packages artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip pyinstaller py7zr pyzipper

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Build standalone Windows executable
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/build_exe.py --require-7z

      - name: Upload Windows executable artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-exe
          path: dist/galgame-patcher-windows-x64.exe
          if-no-files-found: error

  publish-release:
    needs: [build-python, build-windows-exe]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Python packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: release-assets

      - name: Download Windows executable
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-exe
          path: release-assets

      - name: Publish release and asset checksums
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          wheel="galgame_patcher-${version}-py3-none-any.whl"
          source_archive="galgame_patcher-${version}.tar.gz"
          executable="galgame-patcher-windows-x64.exe"
          sha256sum "$wheel" "$source_archive" "$executable" LICENSE.txt > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" "$wheel" "$source_archive" "$executable" LICENSE.txt SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --latest
