name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # 每周一 UTC 03:00 定时巡检依赖、Python 版本与测试健康度
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  lint:
    name: Ruff & Mypy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install lint and type-check tools
        run: python -m pip install --upgrade pip ruff mypy

      - name: Run ruff check
        run: ruff check src tests scripts

      - name: Run mypy
        run: mypy src scripts

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: ubuntu-24.04
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.9.13"
          - os: macos-latest
            python-version: "3.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install coverage and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          python -m pip install --upgrade pip coverage

      - name: Run tests with coverage threshold
        env:
          PYTHONPATH: src
        run: |
          xvfb-run -a coverage run -m unittest discover -s tests -v
          coverage report

  gui-smoke:
    name: GUI Smoke (Linux Xvfb)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Xvfb and Tk runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk

      - name: Run GUI unit and smoke tests under Xvfb
        env:
          PYTHONPATH: src
        run: xvfb-run -a python3 -m unittest tests/test_gui.py -v
