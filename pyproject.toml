[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "galgame-patcher"
dynamic = ["version"]
description = "一键定位并给对应 Galgame 自动打补丁的 Python 库与桌面工具"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.9"
authors = [
    { name = "wlan2979", email = "wlan29793@gmail.com" },
]
keywords = ["galgame", "visual-novel", "patcher", "steam", "cli", "gui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
archive = [
    "py7zr>=0.21.0",
    "pyzipper>=0.3.6",
]
build = [
    "pyinstaller>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/wlan2979/galgame-patcher"
Repository = "https://github.com/wlan2979/galgame-patcher"
Issues = "https://github.com/wlan2979/galgame-patcher/issues"

[project.scripts]
galgame-patcher = "galgame_patcher.cli:main"
galpatch = "galgame_patcher.cli:main"

[project.gui-scripts]
galgame-patcher-gui = "galgame_patcher.gui:launch_gui"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "galgame_patcher._version.__version__" }
